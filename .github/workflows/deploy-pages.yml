name: Deploy to GitHub Pages

# Builds the Hebrew landing page as a static export and publishes it to GitHub
# Pages. Cloudflare sits in front for DNS/TLS and serves /api/contact via a
# Worker (see worker/), so the static site needs no server of its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: write Pages + OIDC token for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      STATIC_EXPORT: "true"
      # NEXT_PUBLIC_SITE_URL is deliberately NOT set here.
      #
      # `siteConfig.domain` in src/config/site.ts is the single source of truth:
      # `siteConfig.url` derives from it, public/CNAME is generated from it by
      # scripts/generate-cname.mjs (the step below), and canonicals, og:url, the
      # sitemap, robots.txt and the JSON-LD ids all read `siteConfig.url`.
      # Setting the var here would reintroduce the second copy that drifted and
      # made every canonical URL on the live site a 404. Set it only for a
      # preview deploy that genuinely lives on another host.
      # PUBLIC base URL of the R2 media bucket ("pnina-website"), inlined at
      # build time. Each clip's filename lives in videos[].remote in
      # src/content/media.ts, so this one value covers all of them.
      #
      # ⚠️ The bucket's PUBLIC read URL — the r2.dev development URL or a custom
      # domain — NOT the *.r2.cloudflarestorage.com S3 API endpoint, which needs
      # signed requests and returns 401 to a browser.
      #
      # Blank ships the bundled public/video copies instead (~11MB), which works
      # but is served by Pages rather than a media origin.
      NEXT_PUBLIC_MEDIA_BASE_URL: "https://media.trickticmedia.com"
      # Per-clip overrides. Only for a video that must come from somewhere other
      # than the bucket above; normally all three stay blank.
      NEXT_PUBLIC_HERO_VIDEO_URL: ""
      NEXT_PUBLIC_THANK_YOU_VIDEO_URL: ""
      NEXT_PUBLIC_ABOUT_VIDEO_URL: ""
      # Analytics ids/URLs — all PUBLIC by design (they ship to the browser), so
      # it is safe to set them here. All OPTIONAL: a blank tracker no-ops.
      #
      # ⚠️ Never add a session-replay or form-capture tracker to this site. Its
      # visitors are women seeking help after a sexual assault; recording what
      # they read or type would be a serious breach of their privacy.
      #
      # GA4 measurement id (GA4 Admin → Data Streams). THIS is the production
      # source of truth — NEXT_PUBLIC_* are inlined at build time, so the value
      # has to be here rather than in an env file, and turning analytics on or
      # off is a rebuild and a republish, not a runtime toggle. `.env.example`
      # deliberately leaves it blank so local dev never reports into the
      # property.
      #
      # ⚠️ GA4 SETS COOKIES (`_ga`, `_ga_8WH5H49LVN`, 2-year, pseudonymous
      # client id). The cookies section of `pages.privacy` in messages/he.json
      # says so, and the two must stay in agreement. The id is validated and
      # Google loads only after opt-in through MinimalCookieConsent; an invalid
      # or blank id makes both the notice and GA complete no-ops.
      NEXT_PUBLIC_GA_ID: G-8WH5H49LVN
      # Set this to your Umami instance's tracker URL, e.g.
      # https://analytics.yourdomain.com/script.js — Umami needs BOTH this and
      # the website id below to load.
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ""
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static export can't compile the POST handler in /api/contact or the
      # force-dynamic /api/health route. The Cloudflare Worker serves
      # /api/contact in production; this only edits the CI checkout.
      - name: Drop server-only API routes
        run: rm -rf src/app/api

      # public/CNAME is generated from siteConfig.domain, so the host Pages
      # answers on and the host in every canonical tag cannot disagree. Run
      # explicitly: this job calls `next build` directly and so never triggers
      # the `prebuild` script.
      - name: Generate public/CNAME from site config
        run: node scripts/generate-cname.mjs

      # Rebuild the WebP ladder under public/images/optimized/ and the manifest
      # that src/lib/image-loader.ts reads. Both are committed, so this is
      # normally a no-op that finishes in under a second — it runs anyway so a
      # forgotten `pnpm optimize:images` can never ship an <img> pointing at a
      # variant that does not exist. Same reason the CNAME step is explicit:
      # this job calls `next build` directly and so never triggers `prebuild`.
      - name: Build responsive image variants
        run: node scripts/optimize-images.mjs

      # Build, then hoist out/he/* to the root so Hebrew is served at / on the
      # static host (next-intl's locale-prefix middleware doesn't run on Pages).
      - name: Build static export
        run: pnpm exec next build && node scripts/flatten-locale-export.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
